<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SciNova India — Admin</title>
<style>
body{margin:0;background:#090a0f;color:#fff;font-family:Arial,sans-serif;padding:30px}main{max-width:1100px;margin:auto}
h1{font-size:clamp(2.5rem,7vw,6rem);letter-spacing:-.06em;margin:0 0 30px}.card{border:1px solid #ffffff22;background:#11131a;padding:24px;margin:16px 0;border-radius:16px}
input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:12px;background:#08090d;color:#fff;border:1px solid #ffffff22;border-radius:8px}
textarea{min-height:160px}button{padding:12px 16px;border:0;border-radius:8px;background:#d7ff00;color:#09090d;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{padding:15px 0;border-bottom:1px solid #ffffff18}.muted{color:#999;font-size:.85rem}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>SCINOVA <span style="color:#00e5ff">ADMIN</span></h1>
<div class="card"><label>Admin token</label><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="saveToken()">SAVE TOKEN</button></div>
<div class="card"><h2>Publish Article</h2>
<div class="grid"><div><label>Title</label><input id="title"></div><div><label>Category</label><input id="category" value="SCIENCE"></div></div>
<div class="grid"><div><label>Author</label><input id="author" value="SciNova India"></div><div><label>Read time (min)</label><input id="read_time" type="number" value="4"></div></div>
<label>Excerpt</label><textarea id="excerpt" style="min-height:80px"></textarea>
<label>Content</label><textarea id="content"></textarea>
<label><input id="published" type="checkbox" checked style="width:auto"> Publish immediately</label><br><button onclick="publish()">PUBLISH TO DATABASE</button>
<div id="msg" class="muted"></div></div>
<div class="card"><h2>Published / Draft Articles</h2><div id="articles">Loading…</div></div>
<div class="card"><h2>Recent Inquiries</h2><div id="inquiries">Loading…</div></div>
</main>
<script>
function tok(){return localStorage.getItem('scinova_admin_token')||''}
function saveToken(){localStorage.setItem('scinova_admin_token',document.querySelector('#token').value);loadAll()}
document.querySelector('#token').value=tok();
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+tok(),'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function publish(){try{const d=await api('/api/articles',{method:'POST',body:JSON.stringify({title:title.value,category:category.value,author:author.value,read_time:read_time.value,excerpt:excerpt.value,content:content.value,published:published.checked})});msg.textContent='Published article #'+d.id;loadAll()}catch(e){msg.textContent=e.message}}
async function loadAll(){try{const a=await api('/api/articles');articles.innerHTML=a.map(x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${esc(x.category)} · ${x.published?'Published':'Draft'} · ${x.created_at}</div><button onclick="del(${x.id})">DELETE</button></div>`).join('')||'No articles yet.';const q=await api('/api/inquiries');inquiries.innerHTML=q.map(x=>`<div class="row"><b>${esc(x.name)}</b> · ${esc(x.email)}<div class="muted">${esc(x.type)} · ${x.created_at}</div><p>${esc(x.message)}</p></div>`).join('')||'No inquiries yet.'}catch(e){articles.textContent=inquiries.textContent=e.message}}
async function del(id){if(!confirm('Delete article?'))return;await api('/api/articles/'+id,{method:'DELETE'});loadAll()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
loadAll();
</script></body></html>
